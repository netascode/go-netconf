name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

jobs:
  # Security check for fork PRs - validates PR source before running workflows with secrets
  security_check:
    name: Security Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    outputs:
      is_fork: ${{ steps.check.outputs.is_fork }}
      is_safe: ${{ steps.check.outputs.is_safe }}
    steps:
      - name: Check PR source
        id: check
        run: |
          IS_FORK="false"
          IS_SAFE="false"

          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK="true"
            echo "Fork PR detected from: ${{ github.event.pull_request.head.repo.full_name }}"
          fi

          # Check if PR has 'safe-to-test' label (maintainer approval)
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'safe-to-test') }}" = "true" ]; then
            IS_SAFE="true"
            echo "PR marked safe-to-test by maintainer"
          fi

          # Non-fork PRs are always safe
          if [ "$IS_FORK" = "false" ]; then
            IS_SAFE="true"
          fi

          echo "is_fork=$IS_FORK" >> $GITHUB_OUTPUT
          echo "is_safe=$IS_SAFE" >> $GITHUB_OUTPUT

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: [security_check]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request_target' && needs.security_check.outputs.is_safe == 'true'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # scrapligo does not test on Windows, so we do (terraform providers ship Windows builds)
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26.x', '1.27.x']
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.2.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Get Go cache paths
      id: go-cache-paths
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.gocache }}
          ${{ steps.go-cache-paths.outputs.gomodcache }}
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests with coverage
      run: |
        # Exclude examples from coverage
        go list ./... | grep -v /examples | xargs go test -v -race -coverprofile=coverage.out -covermode=atomic

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v4.6.0
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-go-netconf
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [security_check]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request_target' && needs.security_check.outputs.is_safe == 'true'))
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.2.0
      with:
        go-version: '1.26.x'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15
        args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [security_check]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request_target' && needs.security_check.outputs.is_safe == 'true'))
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.2.0
      with:
        go-version: '1.26.x'

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

  # License header check job
  # Security: pull_request_target grants write access and secrets to fork PRs
  # Malicious PR could exfiltrate secrets via modified Makefile targets
  # Gated by security_check requiring 'safe-to-test' label from maintainer
  # See security_check job for fork PR protection details
  license:
    name: License Check
    runs-on: ubuntu-latest
    needs: [security_check]
    if: |
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request_target' && needs.security_check.outputs.is_safe == 'true'))
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.2.0
      with:
        go-version: '1.26.x'

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.26.x-addlicense-v1.1.1-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.26.x-addlicense-

    - name: Install addlicense
      run: go install github.com/google/addlicense@v1.1.1

    - name: Check license headers
      run: make check-license
