# gosec configuration
# Reference: https://github.com/securego/gosec

# Global settings
global:
  # Fail on medium severity issues
  nosec: false
  # Show ignored issues
  show-ignored: false
  # Confidence level (low, medium, high)
  confidence: medium
  # Severity level (low, medium, high)
  severity: medium

# Exclude rules
exclude:
  # G104: Audit errors not checked - covered by errcheck linter
  - G104

# Exclude directories
exclude-dir:
  - vendor

# Include test files
tests: true

# Output format
fmt: text

# Enable all rules by default
enable-all: true
